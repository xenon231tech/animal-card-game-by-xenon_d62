<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Animal Card Collection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(ellipse at 20% 30%, #0a1f0e, #030703);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }

        .app {
            max-width: 600px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .stats-box {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            padding: 8px 18px;
            border-radius: 30px;
            text-align: center;
            border: 1px solid rgba(255,200,100,0.3);
        }

        .stats-box .points {
            font-size: 1.5rem;
            font-weight: bold;
            color: #FFD966;
        }

        .stats-box .spins {
            font-size: 0.8rem;
            color: #ccc;
        }

        /* JUDUL */
        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #FFD966, #FF8C00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* WHEEL */
        .wheel-container {
            position: relative;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        canvas {
            background: radial-gradient(circle at 30% 35%, #ffefcf, #ecdcaa);
            border-radius: 50%;
            box-shadow: 0 0 0 6px #ffdd99, 0 0 0 12px #b87333, 0 20px 35px black;
            width: 100%;
            max-width: 300px;
            height: auto;
        }

        .spin-btn {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(145deg, #f5b042, #e07e1a);
            border: none;
            font-weight: 800;
            font-size: 1rem;
            padding: 8px 24px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #984d0c;
            color: white;
        }

        /* LABELS */
        .labels {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .label {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .label-legendary { background: #e6b422; color: #1f1906; }
        .label-epic { background: #9b4e9b; color: white; }
        .label-rare { background: #2a7a8a; color: white; }
        .label-common { background: #6b6b6b; color: white; }

        /* CARD GRID */
        .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
        }

        .card {
            background: linear-gradient(145deg, #3f2e1c, #241a0f);
            border-radius: 20px;
            padding: 10px;
            text-align: center;
            width: 100px;
            border: 1px solid rgba(255,180,70,0.4);
        }

        .card-icon {
            font-size: 2rem;
        }

        .card-rarity {
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-block;
            margin: 5px 0;
        }

        .card-points {
            font-size: 0.7rem;
            color: #FFD966;
        }

        /* NAVIGASI */
        .nav {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 30px;
            padding: 12px 0;
            border-top: 1px solid rgba(255,200,100,0.2);
        }

        .nav-btn {
            background: rgba(20,25,18,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,200,100,0.3);
            padding: 8px 16px;
            border-radius: 30px;
            color: #e0d6b0;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #ffb347, #ff8c00);
            color: #1a1a0a;
        }

        /* PANEL */
        .panel {
            background: rgba(10,15,7,0.8);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255,200,100,0.3);
        }

        .panel h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #FFD966;
            font-size: 1.3rem;
        }

        .shop-item {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .buy-btn {
            background: #ffb347;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,200,100,0.2);
        }

        .progress-bar {
            background: #2c1c12;
            border-radius: 20px;
            height: 16px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            background: linear-gradient(90deg, #ffb347, #ff8c00);
            height: 100%;
            width: 0%;
            border-radius: 20px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 500px) {
            .card { width: 80px; }
            .card-icon { font-size: 1.5rem; }
            .nav-btn { padding: 6px 12px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- HEADER -->
    <div class="header">
        <div class="stats-box">
            <div class="points" id="pointsDisplay">⭐ 0</div>
            <div class="spins" id="spinsDisplay">🎡 0 spins</div>
        </div>
    </div>

    <!-- JUDUL -->
    <div class="title">
        <h1>ANIMAL CARD COLLECTION</h1>
    </div>

    <!-- GAME AREA -->
    <div id="gameArea">
        <div class="wheel-container">
            <canvas id="wheelCanvas" width="280" height="280"></canvas>
            <button class="spin-btn" id="spinButton">SPIN</button>
        </div>

        <div class="labels">
            <span class="label label-legendary">LEGENDARY</span>
            <span class="label label-epic">EPIC</span>
            <span class="label label-rare">RARE</span>
            <span class="label label-common">COMMON</span>
        </div>

        <div class="card-grid" id="recentCards"></div>
    </div>

    <!-- PANEL DINAMIS -->
    <div id="dynamicPanel" class="panel hidden">
        <h2 id="panelTitle"></h2>
        <div id="panelContent"></div>
    </div>

    <!-- NAVIGASI -->
    <div class="nav">
        <button class="nav-btn active" data-tab="game">GAME</button>
        <button class="nav-btn" data-tab="collection">COLLECTION</button>
        <button class="nav-btn" data-tab="shop">SHOP</button>
        <button class="nav-btn" data-tab="stats">STATS</button>
        <button class="nav-btn" data-tab="leaderboard">LEADERBOARD</button>
        <button class="nav-btn" data-tab="me">ME</button>
    </div>

</div>

<script>
    // ==================== DATA KARTU ====================
    const ANIMALS = [
        { name: "ANT", icon: "🐜", rarity: "Common", points: 10 },
        { name: "MOUSE", icon: "🐭", rarity: "Common", points: 10 },
        { name: "CAT", icon: "🐱", rarity: "Rare", points: 50 },
        { name: "DOG", icon: "🐕", rarity: "Rare", points: 55 },
        { name: "EAGLE", icon: "🦅", rarity: "Epic", points: 200 },
        { name: "WOLF", icon: "🐺", rarity: "Epic", points: 180 },
        { name: "DRAGON", icon: "🐉", rarity: "Legendary", points: 1000 }
    ];

    const COLORS = ["#FADB67","#F5CD86","#F0BA6C","#F1C282","#F6D596","#EBB45E","#E5A443"];

    // STATE
    let userPoints = 1240;
    let userSpins = 8;
    let userCards = {};
    let spinning = false;
    let wheelAngle = 0;
    let canvas, ctx;
    let currentTab = "game";

    // LOAD/SAVE
    function loadData() {
        let saved = localStorage.getItem("acc_data");
        if(saved) {
            let data = JSON.parse(saved);
            userPoints = data.points || 1240;
            userSpins = data.spins || 8;
            userCards = data.cards || {};
        } else {
            // default cards untuk demo
            userCards = {
                "DRAGON": 1,
                "EAGLE": 2,
                "CAT": 3,
                "ANT": 5
            };
        }
        updateUI();
    }

    function saveData() {
        let data = {
            points: userPoints,
            spins: userSpins,
            cards: userCards
        };
        localStorage.setItem("acc_data", JSON.stringify(data));
    }

    function updateUI() {
        document.getElementById("pointsDisplay").innerHTML = `⭐ ${userPoints}`;
        document.getElementById("spinsDisplay").innerHTML = `🎡 ${userSpins} spins`;
        updateRecentCards();
    }

    // SPIN WHEEL
    function getRandomCard() {
        let rand = Math.random() * 100;
        if (rand < 60) return ANIMALS.filter(a => a.rarity === "Common")[Math.floor(Math.random() * 2)];
        if (rand < 85) return ANIMALS.filter(a => a.rarity === "Rare")[Math.floor(Math.random() * 2)];
        if (rand < 97) return ANIMALS.filter(a => a.rarity === "Epic")[Math.floor(Math.random() * 2)];
        return ANIMALS.find(a => a.rarity === "Legendary");
    }

    function addCard(cardName) {
        userCards[cardName] = (userCards[cardName] || 0) + 1;
        saveData();
    }

    function spin() {
        if (spinning) return;
        if (userSpins <= 0) {
            alert("No spins left. Go to SHOP to buy more.");
            return;
        }

        userSpins--;
        spinning = true;
        updateUI();

        let speed = 22 + Math.random() * 16;
        let dec = 0.97;

        function animate() {
            speed *= dec;
            wheelAngle += speed * 0.045;
            drawWheel();
            if (speed > 0.35) {
                requestAnimationFrame(animate);
            } else {
                let card = getRandomCard();
                addCard(card.name);
                userPoints += card.points;
                saveData();
                spinning = false;
                updateUI();
                alert(`GOT ${card.icon} ${card.name} (${card.rarity})! +${card.points} POINTS!`);
                if (currentTab === "collection") renderCollection();
                if (currentTab === "stats") renderStats();
                if (currentTab === "leaderboard") renderLeaderboard();
            }
        }
        requestAnimationFrame(animate);
    }

    function drawWheel() {
        if (!canvas) return;
        let w = canvas.width, h = canvas.height;
        let cx = w/2, cy = h/2, r = w * 0.42;
        ctx.clearRect(0, 0, w, h);
        let start = wheelAngle;
        let step = (Math.PI * 2) / ANIMALS.length;
        for (let i = 0; i < ANIMALS.length; i++) {
            let end = start + step;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, start, end);
            ctx.fillStyle = COLORS[i % COLORS.length];
            ctx.fill();
            ctx.strokeStyle = "#a05a2c";
            ctx.stroke();
            ctx.fillStyle = "#281e10";
            ctx.font = `bold ${Math.max(16, r * 0.13)}px "Segoe UI"`;
            let mid = start + step/2;
            let x = cx + Math.cos(mid) * r * 0.68;
            let y = cy + Math.sin(mid) * r * 0.68;
            ctx.fillText(ANIMALS[i].icon, x-8, y+6);
            start = end;
        }
        ctx.fillStyle = "#E25822";
        ctx.beginPath();
        ctx.moveTo(cx-10, cy-r-10);
        ctx.lineTo(cx, cy-r-28);
        ctx.lineTo(cx+10, cy-r-10);
        ctx.fill();
    }

    function updateRecentCards() {
        let container = document.getElementById("recentCards");
        let cards = Object.keys(userCards).slice(-4).reverse();
        let html = "";
        for (let name of cards) {
            let card = ANIMALS.find(a => a.name === name);
            if (card) {
                html += `
                    <div class="card">
                        <div class="card-icon">${card.icon}</div>
                        <div class="card-rarity" style="background:${card.rarity === 'Legendary' ? '#e6b422' : card.rarity === 'Epic' ? '#9b4e9b' : card.rarity === 'Rare' ? '#2a7a8a' : '#6b6b6b'}">${card.rarity}</div>
                        <div class="card-points">⭐ ${card.points}</div>
                    </div>
                `;
            }
        }
        container.innerHTML = html;
    }

    // COLLECTION
    function renderCollection() {
        let html = `<div class="card-grid">`;
        for (let card of ANIMALS) {
            let qty = userCards[card.name] || 0;
            let owned = qty > 0;
            html += `
                <div class="card" style="opacity: ${owned ? 1 : 0.5};">
                    <div class="card-icon">${owned ? card.icon : "?"}</div>
                    <div class="card-rarity" style="background:${card.rarity === 'Legendary' ? '#e6b422' : card.rarity === 'Epic' ? '#9b4e9b' : card.rarity === 'Rare' ? '#2a7a8a' : '#6b6b6b'}">${owned ? card.rarity : "LOCKED"}</div>
                    <div class="card-points">⭐ ${owned ? card.points : "?"}</div>
                    <div>${owned ? `OWNED: ${qty}` : "NOT OWNED"}</div>
                </div>
            `;
        }
        html += `</div>`;
        document.getElementById("panelContent").innerHTML = html;
    }

    // SHOP
    function renderShop() {
        let html = `
            <div class="shop-item"><span>10 SPINS</span><span>1 USDC</span><button class="buy-btn" onclick="buySpins(10,1)">BUY</button></div>
            <div class="shop-item"><span>55 SPINS</span><span>5 USDC</span><button class="buy-btn" onclick="buySpins(55,5)">BUY</button></div>
            <div class="shop-item"><span>120 SPINS</span><span>10 USDC</span><button class="buy-btn" onclick="buySpins(120,10)">BUY</button></div>
            <hr style="margin:15px 0; border-color:rgba(255,200,100,0.3);">
            <div class="shop-item"><span>MYSTERY BOX</span><span>2 USDC</span><button class="buy-btn" onclick="buyGacha()">BUY</button></div>
            <div class="shop-item"><span>2x MULTIPLIER 1 JAM</span><span>2 USDC</span><button class="buy-btn" onclick="buyMultiplier(2,1)">BUY</button></div>
            <div class="shop-item"><span>3x MULTIPLIER 24 JAM</span><span>10 USDC</span><button class="buy-btn" onclick="buyMultiplier(3,24)">BUY</button></div>
            <div class="shop-item"><span>DRAGON CARD</span><span>50 USDC</span><button class="buy-btn" onclick="buyDragon()">BUY</button></div>
            <div class="shop-item"><span>SUBSCRIPTION BULANAN</span><span>5 USDC</span><button class="buy-btn" onclick="buySubscription()">BUY</button></div>
            <div class="shop-item"><span>VIP BADGE GOLD</span><span>20 USDC</span><button class="buy-btn" onclick="buyBadge()">BUY</button></div>
            <div class="shop-item"><span>STARTER BUNDLE</span><span>7 USDC</span><button class="buy-btn" onclick="buyStarter()">BUY</button></div>
            <hr style="margin:15px 0; border-color:rgba(255,200,100,0.3);">
            <p style="font-size:11px; text-align:center;">SEMUA PEMBAYARAN KE WALLET: 0xA79b23182e191fDFb5049FFFb5BEE54830980c81</p>
        `;
        document.getElementById("panelContent").innerHTML = html;
    }

    window.buySpins = function(spins, price) {
        if(confirm(`Buy ${spins} spins for ${price} USDC?`)) {
            alert(`Order received. Send ${price} USDC to: 0xA79b23182e191fDFb5049FFFb5BEE54830980c81`);
            let demo = prompt("DEMO: Type DEMO to add spins");
            if(demo === "DEMO") {
                userSpins += spins;
                saveData();
                updateUI();
                alert(`+${spins} spins added!`);
                if(currentTab === "stats") renderStats();
            }
        }
    }

    window.buyGacha = function() {
        if(confirm("Buy MYSTERY BOX for 2 USDC?")) {
            alert("Order received. Send 2 USDC to: 0xA79b23182e191fDFb5049FFFb5BEE54830980c81");
            let demo = prompt("DEMO: Type DEMO to open box");
            if(demo === "DEMO") {
                let rewards = [5,10,15,25,50];
                let reward = rewards[Math.floor(Math.random() * rewards.length)];
                userSpins += reward;
                saveData();
                updateUI();
                alert(`🎁 MYSTERY BOX: +${reward} SPINS!`);
                if(currentTab === "stats") renderStats();
            }
        }
    }

    window.buyMultiplier = function(x, hours) {
        alert(`Multiplier feature coming soon. Send payment to wallet.`);
    }

    window.buyDragon = function() {
        if(confirm("Buy DRAGON CARD for 50 USDC?")) {
            alert("Order received. Send 50 USDC to wallet.");
            let demo = prompt("DEMO: Type DEMO to get Dragon");
            if(demo === "DEMO") {
                addCard("DRAGON");
                updateUI();
                alert("DRAGON CARD ADDED TO COLLECTION!");
                if(currentTab === "collection") renderCollection();
                if(currentTab === "stats") renderStats();
            }
        }
    }

    window.buySubscription = function() {
        alert("Subscription: 5 USDC/month. Coming soon.");
    }

    window.buyBadge = function() {
        alert("VIP Badge: 20 USDC. Coming soon.");
    }

    window.buyStarter = function() {
        alert("Starter Bundle: 7 USDC. Coming soon.");
    }

    // STATS
    function renderStats() {
        let totalCards = 0;
        let uniqueCards = 0;
        let breakdown = { Common:0, Rare:0, Epic:0, Legendary:0 };
        for(let card of ANIMALS) {
            let qty = userCards[card.name] || 0;
            totalCards += qty;
            if(qty > 0) {
                uniqueCards++;
                breakdown[card.rarity] += qty;
            }
        }
        let progress = Math.round(uniqueCards / ANIMALS.length * 100);
        let html = `
            <div class="stat-row"><span>TOTAL POINTS</span><span>${userPoints}</span></div>
            <div class="stat-row"><span>TOTAL SPINS USED</span><span>${Math.floor(userPoints/10)}</span></div>
            <div class="stat-row"><span>TOTAL CARDS</span><span>${totalCards}</span></div>
            <div class="stat-row"><span>UNIQUE CARDS</span><span>${uniqueCards}/${ANIMALS.length}</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
            <div class="stat-row"><span>COMMON</span><span>${breakdown.Common}</span></div>
            <div class="stat-row"><span>RARE</span><span>${breakdown.Rare}</span></div>
            <div class="stat-row"><span>EPIC</span><span>${breakdo
