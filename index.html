<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🐉 ANIMALS CARD | SPIN & TRADE</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.8.0/dist/web3.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 10% 20%, #0f2e1a, #030a04);
            min-height: 100vh;
            padding: 20px;
        }
        .app {
            max-width: 580px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, rgba(0,0,0,0.7), rgba(30,20,10,0.8));
            backdrop-filter: blur(20px);
            border-radius: 100px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid rgba(255,200,100,0.5);
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .wallet-btn {
            background: #ffb347;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .points-badge {
            background: #2c1c12;
            padding: 8px 20px;
            border-radius: 50px;
            color: #FFD966;
            font-weight: bold;
        }
        .nav {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .nav-btn {
            background: rgba(20,15,8,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,200,100,0.4);
            padding: 10px 18px;
            border-radius: 50px;
            color: #f5e2b0;
            font-weight: 600;
            cursor: pointer;
        }
        .nav-btn.active {
            background: linear-gradient(135deg, #ffb347, #ff9100);
            color: #1e1a0c;
            border-color: #ffdfa0;
            box-shadow: 0 0 12px #ffb347;
        }
        .glass-panel {
            background: rgba(10,15,7,0.75);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 24px 20px;
            border: 1px solid rgba(255,200,100,0.4);
        }
        .wheel-area {
            position: relative;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        canvas {
            background: radial-gradient(circle at 30% 35%, #ffefcf, #ecdcaa);
            border-radius: 50%;
            box-shadow: 0 0 0 6px #ffdd99, 0 0 0 12px #b87333;
            width: 100%;
            height: auto;
        }
        .spin-btn {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(145deg, #f5b042, #e07e1a);
            border: none;
            font-weight: 800;
            padding: 10px 32px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #984d0c;
        }
        .daily-info {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 30px;
            color: #ffdd99;
        }
        .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .card {
            background: linear-gradient(145deg, #3f2e1c, #241a0f);
            border-radius: 24px;
            padding: 12px 6px;
            text-align: center;
            width: 100px;
            border: 1px solid rgba(255,180,70,0.5);
        }
        .card-icon { font-size: 2rem; }
        .rarity-badge {
            font-size: 0.6rem;
            padding: 4px 8px;
            border-radius: 30px;
            display: inline-block;
            margin: 8px 0;
            font-weight: bold;
            color: white;
        }
        .Common { background: #6b6b6b; }
        .Rare { background: #2a7a8a; }
        .Epic { background: #9b4e9b; }
        .Legendary { background: #e6b422; color: #1f1906; }
        .shop-item, .listing-item {
            background: rgba(0,0,0,0.5);
            border-radius: 30px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .buy-btn {
            background: #ffb347;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 5px;
            border-bottom: 1px solid rgba(255,200,100,0.3);
            color: #f0e6c5;
        }
        button.small {
            background: #ffb347;
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
        }
        h2, h3 { text-align: center; margin-bottom: 20px; color: #FFD966; }
        hr { margin: 15px 0; border-color: rgba(255,200,100,0.3); }
    </style>
</head>
<body>
<div class="app" id="app"></div>

<script>
    // ==================== KONFIGURASI ====================
    const DEV_WALLET = "0xA79b23182e191fDFb5049FFFb5BEE54830980c81";
    const FEE_PERCENT = 5; // 5% fee marketplace
    
    // DATA KARTU
    const ANIMALS = [
        { id: 0, name: "🐜 ANT", rarity: "Common", points: 10, icon: "🐜" },
        { id: 1, name: "🐭 MOUSE", rarity: "Common", points: 10, icon: "🐭" },
        { id: 2, name: "🐱 CAT", rarity: "Rare", points: 50, icon: "🐱" },
        { id: 3, name: "🐕 DOG", rarity: "Rare", points: 55, icon: "🐕" },
        { id: 4, name: "🦅 EAGLE", rarity: "Epic", points: 200, icon: "🦅" },
        { id: 5, name: "🐉 DRAGON", rarity: "Legendary", points: 1000, icon: "🐉" },
        { id: 6, name: "🐺 WOLF", rarity: "Epic", points: 180, icon: "🐺" }
    ];
    const COLORS = ["#FADB67","#F5CD86","#F0BA6C","#F1C282","#F6D596","#EBB45E","#E5A443"];
    
    // STATE GAME
    let userPoints = 0;        // buat airdrop nanti
    let userSpins = 5;         // spins yang bisa dipake
    let lastDailyClaim = 0;
    let userCards = {};
    let marketplaceListings = [];
    let playerName = "Collector";
    let currentTab = "game";
    
    // WALLET STATE
    let web3 = null;
    let walletConnected = false;
    let userWallet = null;
    
    // SPIN WHEEL STATE
    let spinning = false;
    let wheelAngle = 0;
    let canvas, ctx;
    
    // ==================== LOAD/SAVE ====================
    function loadData() {
        let p = localStorage.getItem("ac_points");
        userPoints = p ? parseInt(p) : 0;
        let s = localStorage.getItem("ac_spins");
        userSpins = s ? parseInt(s) : 5;
        let d = localStorage.getItem("ac_daily");
        lastDailyClaim = d ? parseInt(d) : 0;
        let c = localStorage.getItem("ac_cards");
        userCards = c ? JSON.parse(c) : {};
        let m = localStorage.getItem("ac_market");
        marketplaceListings = m ? JSON.parse(m) : [];
        let n = localStorage.getItem("ac_name");
        if(n) playerName = n;
    }
    
    function saveData() {
        localStorage.setItem("ac_points", userPoints);
        localStorage.setItem("ac_spins", userSpins);
        localStorage.setItem("ac_daily", lastDailyClaim);
        localStorage.setItem("ac_cards", JSON.stringify(userCards));
        localStorage.setItem("ac_market", JSON.stringify(marketplaceListings));
        localStorage.setItem("ac_name", playerName);
    }
    
    // ==================== DAILY SPIN ====================
    function claimDailySpin() {
        const now = Date.now();
        const oneDay = 24 * 60 * 60 * 1000;
        if (now - lastDailyClaim >= oneDay) {
            userSpins += 3;
            lastDailyClaim = now;
            saveData();
            render();
            alert("🎁 Daily bonus claimed! +3 Free Spins!");
        } else {
            const hoursLeft = Math.ceil((oneDay - (now - lastDailyClaim)) / (60 * 60 * 1000));
            alert(`⏰ Next daily spin in ${hoursLeft} hours!`);
        }
    }
    
    // ==================== SPIN WHEEL ====================
    function getRandomCard() {
        let rand = Math.random() * 100;
        if (rand < 60) return ANIMALS.filter(a => a.rarity === "Common")[Math.floor(Math.random() * 2)];
        if (rand < 85) return ANIMALS.filter(a => a.rarity === "Rare")[Math.floor(Math.random() * 2)];
        if (rand < 97) return ANIMALS.filter(a => a.rarity === "Epic")[Math.floor(Math.random() * 2)];
        return ANIMALS.find(a => a.rarity === "Legendary");
    }
    
    function addCard(cardId, qty = 1) {
        userCards[cardId] = (userCards[cardId] || 0) + qty;
        saveData();
    }
    
    async function doSpin() {
        if (spinning) return;
        if (userSpins <= 0) {
            alert("❌ No spins left! Buy more in SHOP or claim daily spin!");
            return;
        }
        
        userSpins--;
        saveData();
        spinning = true;
        render();
        
        let speed = 25 + Math.random() * 18;
        let dec = 0.97;
        
        function animate() {
            speed *= dec;
            wheelAngle += speed * 0.045;
            drawWheel();
            if (speed > 0.35) {
                requestAnimationFrame(animate);
            } else {
                let card = getRandomCard();
                addCard(card.id, 1);
                userPoints += card.points;
                saveData();
                spinning = false;
                render();
                alert(`✨🎉 GOT ${card.name} (${card.rarity})! +${card.points} points! 🎉✨`);
            }
        }
        requestAnimationFrame(animate);
    }
    
    function drawWheel() {
        if (!canvas) return;
        let w = canvas.width, h = canvas.height;
        let cx = w/2, cy = h/2, r = w * 0.42;
        ctx.clearRect(0, 0, w, h);
        let start = wheelAngle;
        let step = (Math.PI * 2) / ANIMALS.length;
        for (let i = 0; i < ANIMALS.length; i++) {
            let end = start + step;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, start, end);
            ctx.fillStyle = COLORS[i % COLORS.length];
            ctx.fill();
            ctx.strokeStyle = "#a05a2c";
            ctx.stroke();
            ctx.fillStyle = "#281e10";
            ctx.font = `bold ${Math.max(18, r * 0.14)}px "Segoe UI"`;
            let mid = start + step/2;
            let x = cx + Math.cos(mid) * r * 0.68;
            let y = cy + Math.sin(mid) * r * 0.68;
            ctx.fillText(ANIMALS[i].icon, x-8, y+6);
            start = end;
        }
        ctx.fillStyle = "#E25822";
        ctx.beginPath();
        ctx.moveTo(cx-12, cy-r-10);
        ctx.lineTo(cx, cy-r-28);
        ctx.lineTo(cx+12, cy-r-10);
        ctx.fill();
    }
    
    // ==================== WALLET (SIMPLE METAMASK/TRUST) ====================
    async function connectWalletSimple() {
        if (typeof window.ethereum !== 'undefined') {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userWallet = accounts[0];
                walletConnected = true;
                web3 = new Web3(window.ethereum);
                render();
                alert(`✅ Wallet connected: ${userWallet.slice(0,6)}...${userWallet.slice(-4)}`);
                
                window.ethereum.on('accountsChanged', (accounts) => {
                    if (accounts.length > 0) {
                        userWallet = accounts[0];
                        render();
                    } else {
                        disconnectWalletSimple();
                    }
                });
                return true;
            } catch (error) {
                alert("❌ Connection failed: " + error.message);
                return false;
            }
        } else {
            alert("❌ No wallet detected! Please install MetaMask or Trust Wallet.");
            return false;
        }
    }
    
    function disconnectWalletSimple() {
        userWallet = null;
        walletConnected = false;
        web3 = null;
        render();
        alert("Wallet disconnected");
    }
    
    // ==================== PEMBAYARAN USDC MULTI-CHAIN ====================
    async function payWithUSDC(amountUSDC, spinsToAdd) {
        if (!walletConnected || !userWallet) {
            let confirm = confirm("Connect wallet first?");
            if (confirm) await connectWalletSimple();
            else return false;
        }
        
        if (!web3) {
            alert("Web3 not ready");
            return false;
        }
        
        // USDC Contract Address (BSC - bisa diganti chain lain)
        const USDC_ADDRESS = "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d"; // BSC USDC
        const USDC_ABI = [
            "function transfer(address to, uint256 amount) public returns (bool)",
            "function decimals() view returns (uint8)",
            "function balanceOf(address) view returns (uint256)"
        ];
        
        try {
            const contract = new web3.eth.Contract(USDC_ABI, USDC_ADDRESS);
            const decimals = await contract.methods.decimals().call();
            const amount = web3.utils.toBN(amountUSDC * Math.pow(10, decimals));
            
            // Kirim USDC ke wallet developer
            const tx = await contract.methods.transfer(DEV_WALLET, amount).send({ from: userWallet });
            
            alert(`✅ Payment successful!\nTX: ${tx.transactionHash.slice(0,10)}...\n+${spinsToAdd} Spins added!`);
            
            userSpins += spinsToAdd;
            saveData();
            render();
            return true;
            
        } catch (error) {
            alert(`❌ Payment failed: ${error.message}`);
            return false;
        }
    }
    
    // ==================== MARKETPLACE ====================
    function listCard(cardId, priceETH) {
        let card = ANIMALS.find(c => c.id === cardId);
        if (!card) return;
        if (!userCards[cardId] || userCards[cardId] < 1) {
            alert("You don't own this card!");
            return;
        }
        
        let p = parseFloat(priceETH);
        if (isNaN(p) || p <= 0) {
            alert("Invalid price!");
            return;
        }
        
        marketplaceListings.push({
            id: Date.now(),
            cardId: cardId,
            cardName: card.name,
            cardIcon: card.icon,
            rarity: card.rarity,
            priceETH: p,
            seller: playerName,
            sellerWallet: userWallet || "unknown"
        });
        
        userCards[cardId]--;
        if (userCards[cardId] === 0) delete userCards[cardId];
        saveData();
        render();
        alert(`${card.name} listed for ${p} ETH!`);
    }
    
    async function buyListing(listingId) {
        let listing = marketplaceListings.find(l => l.id === listingId);
        if (!listing) {
            alert("Listing not found!");
            return;
        }
        
        if (!walletConnected || !userWallet) {
            let confirm = confirm("Connect wallet to buy this card?");
            if (confirm) await connectWalletSimple();
            else return;
        }
        
        if (!web3) return;
        
        // Hitung fee 5% untuk developer
        const fee = listing.priceETH * (FEE_PERCENT / 100);
        const sellerGets = listing.priceETH - fee;
        
        try {
            // Transfer ETH ke seller
            const sellerTx = await web3.eth.sendTransaction({
                from: userWallet,
                to: listing.sellerWallet,
                value: web3.utils.toWei(sellerGets.toString(), 'ether')
            });
            
            // Transfer fee ke developer wallet
            if (fee > 0) {
                await web3.eth.sendTransaction({
                    from: userWallet,
                    to: DEV_WALLET,
                    value: web3.utils.toWei(fee.toString(), 'ether')
                });
            }
            
            alert(`✅ Purchase successful!\nCard added to your collection.`);
            
            // Add card ke pembeli
            addCard(listing.cardId, 1);
            
            // Hapus listing
            marketplaceListings = marketplaceListings.filter(l => l.id !== listingId);
            saveData();
            render();
            
        } catch (error) {
            alert(`❌ Purchase failed: ${error.message}`);
        }
    }
    
    function cancelListing(listingId) {
        let listing = marketplaceListings.find(l => l.id === listingId);
        if (listing && listing.seller === playerName) {
            addCard(listing.cardId, 1);
            marketplaceListings = marketplaceListings.filter(l => l.id !== listingId);
            saveData();
            render();
            alert("Listing cancelled, card returned to your collection.");
        }
    }
    
    // ==================== RENDER UI ====================
    function render() {
        let app = document.getElementById("app");
        if (!app) return;
        
        let totalCards = Object.values(userCards).reduce((a,b) => a+b, 0);
        let uniqueCards = Object.keys(userCards).length;
        let walletShort = userWallet ? `${userWallet.slice(0,6)}...${userWallet.slice(-4)}` : "Not connected";
        
        let html = `
            <div class="header">
                <div class="player-info">
                    <span style="color:#FFD966;">✨ ${playerName}</span>
                    ${!walletConnected ? 
                        `<button class="wallet-btn" onclick="connectWalletSimple()">🔌 Connect Wallet</button>` :
                        `<span style="background:#2c1c12; padding:5px 12px; border-radius:40px;">🦊 ${walletShort}</span>
                         <button class="wallet-btn" onclick="disconnectWalletSimple()" style="background:#8a3a3a;">Disconnect</button>`
                    }
                </div>
                <div class="points-badge">⭐ ${userPoints} pts | 🎡 ${userSpins} spins</div>
            </div>
            
            <div class="nav">
                <button class="nav-btn ${currentTab === 'game' ? 'active' : ''}" onclick="setTab('game')">🎡 GAME</button>
                <button class="nav-btn ${currentTab === 'collection' ? 'active' : ''}" onclick="setTab('collection')">📦 COLLECTION</button>
                <button class="nav-btn ${currentTab === 'market' ? 'active' : ''}" onclick="setTab('market')">🛒 MARKET</button>
                <button class="nav-btn ${currentTab === 'shop' ? 'active' : ''}" onclick="setTab('shop')">💰 SHOP</button>
                <button class="nav-btn ${currentTab === 'profile' ? 'active' : ''}" onclick="setTab('profile')">🏆 PROFILE</button>
            </div>
        `;
        
        if (currentTab === 'game') {
            html += `
                <div class="glass-panel">
                    <div class="daily-info">
                        🎁 Daily Free Spin: <button class="small" onclick="claimDailySpin()">Claim 3 Spins</button>
                    </div>
