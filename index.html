
<!DOCTYPE html>
<html>
<head>
    <title>TEST - Animals Card</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #0f2e1a;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }
        button {
            background: #ffb347;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            margin: 10px;
            cursor: pointer;
        }
        .panel {
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 20px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>🐉 ANIMALS CARD GAME 🐜</h1>
    
    <div class="panel">
        <h2 id="points">⭐ POINTS: 0</h2>
        <h2 id="spins">🎡 SPINS: 5</h2>
        <button onclick="doSpin()">🌀 SPIN!</button>
        <button onclick="claimDaily()">🎁 Daily Spin</button>
    </div>
    
    <div class="panel">
        <button onclick="showCollection()">📦 COLLECTION</button>
        <button onclick="showShop()">💰 SHOP</button>
        <button onclick="showStats()">📊 STATS</button>
    </div>

    <script>
        // DATA
        let points = 0;
        let spins = 5;
        let lastDaily = 0;
        let cards = [];
        
        // LOAD SAVE
        function loadGame() {
            let savedPoints = localStorage.getItem("points");
            let savedSpins = localStorage.getItem("spins");
            let savedDaily = localStorage.getItem("lastDaily");
            let savedCards = localStorage.getItem("cards");
            
            if(savedPoints) points = parseInt(savedPoints);
            if(savedSpins) spins = parseInt(savedSpins);
            if(savedDaily) lastDaily = parseInt(savedDaily);
            if(savedCards) cards = JSON.parse(savedCards);
            else cards = [];
            
            updateUI();
        }
        
        function saveGame() {
            localStorage.setItem("points", points);
            localStorage.setItem("spins", spins);
            localStorage.setItem("lastDaily", lastDaily);
            localStorage.setItem("cards", JSON.stringify(cards));
        }
        
        function updateUI() {
            document.getElementById("points").innerHTML = `⭐ POINTS: ${points}`;
            document.getElementById("spins").innerHTML = `🎡 SPINS: ${spins}`;
        }
        
        // DAILY SPIN
        function claimDaily() {
            let now = Date.now();
            let oneDay = 24 * 60 * 60 * 1000;
            
            if (now - lastDaily >= oneDay) {
                spins += 3;
                lastDaily = now;
                saveGame();
                updateUI();
                alert("🎁 +3 Free Spins!");
            } else {
                let hours = Math.ceil((oneDay - (now - lastDaily)) / (60 * 60 * 1000));
                alert(`⏰ Next spin in ${hours} hours!`);
            }
        }
        
        // SPIN
        function doSpin() {
            if (spins <= 0) {
                alert("No spins left! Get daily bonus!");
                return;
            }
            
            spins--;
            
            // Random kartu
            let animals = ["🐜 ANT", "🐭 MOUSE", "🐱 CAT", "🐕 DOG", "🦅 EAGLE", "🐉 DRAGON", "🐺 WOLF"];
            let pointsGain = [10, 10, 50, 55, 200, 1000, 180];
            let idx = Math.floor(Math.random() * animals.length);
            let card = animals[idx];
            let gain = pointsGain[idx];
            
            points += gain;
            cards.push(card);
            saveGame();
            updateUI();
            
            alert(`🎉 GOT ${card}! +${gain} POINTS!`);
        }
        
        // COLLECTION
        function showCollection() {
            if (cards.length === 0) {
                alert("No cards yet! Spin the wheel!");
                return;
            }
            
            let counts = {};
            for (let c of cards) {
                counts[c] = (counts[c] || 0) + 1;
            }
            
            let msg = "📦 YOUR CARDS:\n";
            for (let [card, qty] of Object.entries(counts)) {
                msg += `${card} x${qty}\n`;
            }
            alert(msg);
        }
        
        // SHOP
        function showShop() {
            alert("💰 SPIN SHOP\n\n10 Spins = 1 USDC\n50 Spins = 5 USDC\n\nSend payment to:\n0xA79b23182e191fDFb5049FFFb5BEE54830980c81\n\nContact admin after payment to get spins!");
        }
        
        // STATS
        function showStats() {
            let unique = [...new Set(cards)].length;
            alert(`📊 YOUR STATS\n\n⭐ Points: ${points}\n🎡 Spins: ${spins}\n🃏 Total Cards: ${cards.length}\n✨ Unique Cards: ${unique}/7`);
        }
        
        // LOAD
        loadGame();
    </script>
</body>
</html>
