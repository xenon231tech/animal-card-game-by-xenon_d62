<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>✨ Animals Card | Spin & Collect ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0f2e1a, #051007);
            min-height: 100vh;
            padding: 16px;
        }
        
        /* Glassmorphism Card */
        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(255, 215, 150, 0.25);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        .app {
            max-width: 560px;
            margin: 0 auto;
        }
        
        /* Header Premium */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            border: 1px solid rgba(255,200,100,0.3);
        }
        
        .player-name {
            font-weight: 700;
            background: linear-gradient(135deg, #FFD966, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1rem;
        }
        
        .points-badge {
            background: linear-gradient(135deg, #2c1c12, #1f120a);
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 800;
            color: #FFD966;
            font-size: 1.3rem;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.1), 0 4px 12px rgba(0,0,0,0.3);
        }
        
        .points-badge span {
            font-size: 0.8rem;
            color: #c0a06b;
        }
        
        /* Navigation */
        .nav {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .nav-btn {
            background: rgba(30,30,20,0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,200,100,0.3);
            padding: 10px 18px;
            border-radius: 50px;
            color: #e0d6b0;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .nav-btn.active {
            background: linear-gradient(135deg, #FFB347, #FF8C00);
            color: #1a1a0a;
            border-color: #FFD966;
            box-shadow: 0 0 12px rgba(255,180,50,0.5);
        }
        
        /* Panel */
        .panel {
            padding: 24px 20px;
            border-radius: 40px;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,215,150,0.3);
        }
        
        /* Wheel */
        .wheel-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }
        
        canvas {
            background: radial-gradient(circle at 30% 30%, #f9efcf, #e9d4a0);
            border-radius: 50%;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4), inset 0 0 0 4px #ffefbf, inset 0 0 0 10px #c97e2e;
            transition: all 0.2s;
        }
        
        .spin-btn {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #FFB347, #FF8C00);
            border: none;
            font-weight: 800;
            font-size: 1.2rem;
            padding: 10px 28px;
            border-radius: 60px;
            color: #2c1a0a;
            cursor: pointer;
            box-shadow: 0 6px 0 #a25917;
            transition: 0.05s linear;
            font-family: 'Inter', sans-serif;
            letter-spacing: 1px;
        }
        
        .spin-btn:active {
            transform: translateX(-50%) translateY(4px);
            box-shadow: 0 2px 0 #a25917;
        }
        
        /* Card Grid */
        .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
            max-height: 360px;
            overflow-y: auto;
            padding: 4px;
        }
        
        .card {
            background: linear-gradient(145deg, #3d2a18, #2a1a0e);
            border-radius: 24px;
            padding: 12px 8px;
            text-align: center;
            width: 100px;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255,200,100,0.4);
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
            border-color: #FFB347;
        }
        
        .card-name {
            font-size: 1.8rem;
        }
        
        .card-rarity {
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 40px;
            display: inline-block;
            margin: 8px 0;
            font-weight: 700;
        }
        
        .rarity-Common { background: #6c6c6c; color: white; box-shadow: inset 0 0 4px silver; }
        .rarity-Rare { background: #2d7f8c; color: white; box-shadow: inset 0 0 4px #5fc3ff; }
        .rarity-Epic { background: #aa6faa; color: white; box-shadow: inset 0 0 4px #e599ff; }
        .rarity-Legendary { background: #d4af37; color: #2c1a0a; box-shadow: inset 0 0 6px #fff0a0; }
        
        .card-points {
            font-size: 0.7rem;
            color: #FFD966;
            margin: 4px 0;
        }
        
        /* Buttons */
        button.small {
            background: rgba(255,180,70,0.9);
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        
        button.danger {
            background: #8a3a3a;
            color: white;
        }
        
        h2, h3 {
            text-align: center;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        
        hr {
            border-color: rgba(255,200,100,0.3);
            margin: 20px 0;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,215,150,0.2);
        }
        
        /* Scrollbar */
        .card-grid::-webkit-scrollbar {
            width: 4px;
        }
        .card-grid::-webkit-scrollbar-track {
            background: #2c1c12;
            border-radius: 10px;
        }
        .card-grid::-webkit-scrollbar-thumb {
            background: #FFB347;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="app" id="app"></div>

<script>
    // ==================== GAME DATA ====================
    const ANIMALS = [
        { id: 0, name: "🐜 ANT", rarity: "Common", points: 10, icon: "🐜" },
        { id: 1, name: "🐭 MOUSE", rarity: "Common", points: 10, icon: "🐭" },
        { id: 2, name: "🐱 CAT", rarity: "Rare", points: 50, icon: "🐱" },
        { id: 3, name: "🐕 DOG", rarity: "Rare", points: 55, icon: "🐕" },
        { id: 4, name: "🦅 EAGLE", rarity: "Epic", points: 200, icon: "🦅" },
        { id: 5, name: "🐉 DRAGON", rarity: "Legendary", points: 1000, icon: "🐉" },
        { id: 6, name: "🐺 WOLF", rarity: "Epic", points: 180, icon: "🐺" }
    ];
    const COLORS = ["#FADB67","#F5CD86","#F0BA6C","#F1C282","#F6D596","#EBB45E","#E5A443"];
    
    let userPoints = 100;
    let userCards = {};
    let playerName = "Collector";
    let currentTab = "game";
    let spinning = false;
    let wheelAngle = 0;
    
    function loadData() {
        let p = localStorage.getItem("ac_points");
        if(p) userPoints = parseInt(p);
        let c = localStorage.getItem("ac_cards");
        if(c) userCards = JSON.parse(c);
        else userCards = {};
        let n = localStorage.getItem("ac_name");
        if(n) playerName = n;
    }
    function saveData() {
        localStorage.setItem("ac_points", userPoints);
        localStorage.setItem("ac_cards", JSON.stringify(userCards));
        localStorage.setItem("ac_name", playerName);
    }
    
    function addCard(cardId, qty = 1) {
        userCards[cardId] = (userCards[cardId] || 0) + qty;
        saveData();
    }
    
    function getRandomCard() {
        let rand = Math.random() * 100;
        if (rand < 60) return ANIMALS.filter(a => a.rarity === "Common")[Math.floor(Math.random() * 2)];
        if (rand < 85) return ANIMALS.filter(a => a.rarity === "Rare")[Math.floor(Math.random() * 2)];
        if (rand < 97) return ANIMALS.filter(a => a.rarity === "Epic")[Math.floor(Math.random() * 2)];
        return ANIMALS.find(a => a.rarity === "Legendary");
    }
    
    async function spinWheel() {
        if (spinning) return;
        if (userPoints < 10) {
            alert("✨ Not enough points! Spin costs 10 points.");
            return;
        }
        userPoints -= 10;
        saveData();
        spinning = true;
        render();
        
        let speed = 25 + Math.random() * 18;
        let dec = 0.97;
        
        function animate() {
            speed *= dec;
            wheelAngle += speed * 0.045;
            drawWheel();
            if (speed > 0.35) {
                requestAnimationFrame(animate);
            } else {
                let card = getRandomCard();
                addCard(card.id, 1);
                userPoints += card.points;
                saveData();
                spinning = false;
                render();
                alert(`✨🎉 GOT ${card.name} (${card.rarity})! +${card.points} points! 🎉✨`);
            }
        }
        requestAnimationFrame(animate);
    }
    
    let canvas, ctx;
    function drawWheel() {
        if (!canvas) return;
        let w = canvas.width, h = canvas.height;
        let cx = w/2, cy = h/2, r = w * 0.42;
        ctx.clearRect(0, 0, w, h);
        let start = wheelAngle;
        let step = (Math.PI * 2) / ANIMALS.length;
        for (let i = 0; i < ANIMALS.length; i++) {
            let end = start + step;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, start, end);
            ctx.fillStyle = COLORS[i % COLORS.length];
            ctx.fill();
            ctx.strokeStyle = "#b87c3a";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = "#2f2418";
            ctx.font = `bold ${Math.max(18, r * 0.14)}px "Inter"`;
            let mid = start + step/2;
            let x = cx + Math.cos(mid) * r * 0.68;
            let y = cy + Math.sin(mid) * r * 0.68;
            ctx.fillText(ANIMALS[i].icon, x-8, y+6);
            start = end;
        }
        ctx.fillStyle = "#E25822";
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.moveTo(cx-12, cy-r-10);
        ctx.lineTo(cx, cy-r-28);
        ctx.lineTo(cx+12, cy-r-10);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    function render() {
        let app = document.getElementById("app");
        if (!app) return;
        let totalCards = Object.values(userCards).reduce((a,b) => a+b, 0);
        let unique = Object.keys(userCards).length;
        
        let html = `
            <div class="header">
                <div class="player-name">⭐ ${playerName}</div>
                <div class="points-badge"><span>✨</span> ${userPoints} <span>pts</span></div>
            </div>
            <div class="nav">
                ${['game','collection','market','shop','profile'].map(tab => `
                    <button class="nav-btn ${currentTab === tab ? 'active' : ''}" onclick="setTab('${tab}')">
                        ${tab === 'game' ? '🎮 GAME' : tab === 'collection' ? '📦 COLLECTION' : tab === 'market' ? '🛒 MARKET' : tab === 'shop' ? '💰 SHOP' : '👤 PROFILE'}
                    </button>
                `).join('')}
            </div>
        `;
        
        if (currentTab === 'game') {
            html += `
                <div class="panel">
                    <div class="wheel-wrapper">
                        <canvas id="wheelCanvas" width="280" height="280"></canvas>
                        <button class="spin-btn" onclick="spinWheel()">⚡ SPIN (10)</button>
                    </div>
                    <div class="card-grid" id="cardGrid"></div>
                </div>
            `;
        } 
        else if (currentTab === 'collection') {
            html += `<div class="panel"><h2>📦 MY COLLECTION</h2><div class="card-grid" id="cardGrid"></div></div>`;
        }
        else if (currentTab === 'market') {
            html += `<div class="panel"><h2>🛒 MARKETPLACE</h2><p style="text-align:center; opacity:0.8;">✨ Coming soon: Trade cards with others ✨</p></div>`;
        }
        else if (currentTab === 'shop') {
            html += `<div class="panel"><h2>💰 CRYPTO SHOP</h2><p style="text-align:center;">⚡ Buy points with BNB (BSC) — soon ⚡</p><p style="text-align:center;font-size:12px;">Wallet: 0xA79b2318...80c81</p></div>`;
        }
        else if (currentTab === 'profile') {
            let rarityMap = { Common:0, Rare:0, Epic:0, Legendary:0 };
            for (let [id, qty] of Object.entries(userCards)) {
                let card = ANIMALS.find(c => c.id == id);
                if (card) rarityMap[card.rarity] += qty;
            }
            html += `
                <div class="panel">
                    <h2>👤 COLLECTOR STATS</h2>
                    <div class="stat-row"><span>🏆 Name</span><span>${playerName} <button class="small" onclick="changeName()">edit</button></span></div>
                    <div class="stat-row"><span>⭐ Points</span><span>${userPoints}</span></div>
                    <div class="stat-row"><span>🃏 Total cards</span><span>${totalCards}</span></div>
                    <div class="stat-row"><span>✨ Unique cards</span><span>${unique} / ${ANIMALS.length}</span></div>
                    <div class="stat-row"><span>📊 Progress</span><span>${Math.round(unique/ANIMALS.length*100)}%</span></div>
                    <hr>
                    <div class="stat-row"><span>📗 Common</span><span>${rarityMap.Common}</span></div>
                    <div class="stat-row"><span>📘 Rare</span><span>${rarityMap.Rare}</span></div>
                    <div class="stat-row"><span>📙 Epic</span><span>${rarityMap.Epic}</span></div>
                    <div class="stat-row"><span>📕 Legendary</span><span>${rarityMap.Legendary}</span></div>
                    <button onclick="resetGame()" class="small danger" style="margin-top:24px; width:100%;">🔄 RESET GAME</button>
                </div>
            `;
        }
        
        app.innerHTML = html;
        
        if (currentTab === 'game' || currentTab === 'collection') {
            let grid = document.getElementById("cardGrid");
            if (grid) {
                let cardsHtml = "";
                for (let card of ANIMALS) {
                    let qty = userCards[card.id] || 0;
                    let hidden = (currentTab === 'game' && qty === 0);
                    cardsHtml += `
                        <div class="card" style="${hidden ? 'opacity:0.5; filter:grayscale(0.2);' : ''}">
                            <div class="card-name">${hidden ? '❓' : card.icon}</div>
                            <div class="card-rarity rarity-${card.rarity}">${hidden ? '???' : card.rarity}</div>
                            <div class="card-points">⭐ ${hidden ? '?' : card.points}</div>
                            <div>${hidden ? '???' : 'Owned: '+qty}</div>
                        </div>
                    `;
                }
                grid.innerHTML = cardsHtml;
            }
        }
        
        if (currentTab === 'game') {
            canvas = document.getElementById("wheelCanvas");
            if (canvas) { ctx = canvas.getContext("2d"); drawWheel(); }
        }
    }
    
    function setTab(tab) { currentTab = tab; render(); }
    function changeName() { let newName = prompt("Your collector name:", playerName); if(newName?.trim()) { playerName = newName.trim(); saveData(); render(); } }
    function resetGame() { if(confirm("⚠️ Reset all cards & points?")) { userPoints=100; userCards={}; saveData(); render(); } }
    
    window.setTab = setTab;
    window.spinWheel = spinWheel;
    window.changeName = changeName;
    window.resetGame = resetGame;
    
    loadData();
    render();
</script>
</body>
</html>
